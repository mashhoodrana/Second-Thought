[project]
name = "second-thought-backend"
version = "0.1.0"
description = "Second Thought — FastAPI backend (Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.0",
    "supabase>=2.31.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "google-genai==2.17.0",
    "langgraph==1.2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
